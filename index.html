<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Resume</title>
    <style>
        /* Optional: styling for the page */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f4;
        }
        .content {
            width: 80%;
            margin: 0 auto;
        }
        iframe {
            border: none;
            width: 100%;
            height: 600px; /* You can adjust the height as needed */
        }
        .download-btn {
            display: block;
            margin: 20px auto;
            padding: 10px 20px;
            background-color: #007BFF;
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 5px;
        }
        .download-btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="content">
        <!-- Embed the Google Drive Resume -->
        <iframe src="https://drive.google.com/file/d/1iilSfR2GAxqjYlZHRQbBu188CXYzyyDl/preview" width="100%" height="600px"></iframe>

        <!-- Optionally, add a download button as well -->
        <a href="https://drive.google.com/file/d/1iilSfR2GAxqjYlZHRQbBu188CXYzyyDl/view?usp=sharing" target="_blank" class="download-btn">Download My Resume</a>
    </div>

</body>
</html>
