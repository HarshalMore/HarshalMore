
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume</title>
    <style>
        .download-btn {
            background-color: #4CAF50; /* Green */
            border: none;
            color: white;
            padding: 10px 20px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
        }

        .download-btn:hover {
            background-color: #45a049;
        }

        iframe {
            width: 100%;
            height: 600px;
            border: none;
            margin-top: 20px;
        }

        .container {
            text-align: center;
            margin-top: 50px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>My Resume</h1>
        <p>Here is my resume displayed below. You can also download it by clicking the button.</p>

        <!-- Display the resume PDF using an iframe -->
        <iframe src="https://github.com/harshalmore/HarshalMore/raw/main/resume-interface.pdf" title="Resume"></iframe>

        <!-- Download button -->
        <button class="download-btn" onclick="window.location.href='https://github.com/harshalmore/HarshalMore/raw/main/resume-interface.pdf'">Download My Resume</button>
    </div>
</body>
</html>
